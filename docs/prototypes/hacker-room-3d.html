      y+=40;});
    y+=10; line('↑↓ or click · enter to open · type "help" · esc to stand up',D);

// ---------- camera poses ----------
const standPos=new THREE.Vector3(0.9,1.6,0.2);
const look=new THREE.Vector3(DX,1.05,DZ).sub(standPos);
let yaw=Math.atan2(-look.x,-look.z), pitch=Math.atan2(look.y,Math.hypot(look.x,look.z));
const yaw0=yaw;
const euler=new THREE.Euler(0,0,0,'YXZ');
camera.position.copy(standPos);
function standQuat(){euler.set(pitch,yaw,0);return new THREE.Quaternion().setFromEuler(euler);}
function seatPose(){
  const asp=innerWidth/innerHeight; const back=Math.max(0,(1.7-asp))*0.9;
  const p=new THREE.Vector3(DX,1.32,-2.35+back); const tmp=new THREE.PerspectiveCamera(); tmp.position.copy(p); tmp.lookAt(DX,1.22,DZ-0.1); return {p,q:tmp.quaternion.clone()};
}
let tween=null;
const ease=k=>k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function tweenTo(p,q,dur,done){tween={fp:camera.position.clone(),fq:camera.quaternion.clone(),p,q,start:clock.getElapsedTime(),dur,done};}

function sit(){
  if(S.pose!=='standing')return; S.pose='moving'; hintEl.textContent='sitting down ...';
  const {p,q}=seatPose();
  chair.userData.spin=0;
  tweenTo(p,q,1.9,()=>{S.pose='seated'; standBtn.style.display='block';
    const t=clock.getElapsedTime();
    if(!S.booted){S.booted=true;S.mode='boot';S.bootT=t;glitch(t);}
    hintEl.textContent='↑↓ / click to choose · type "help" · Esc to stand up';
  });
}
function standUp(){
  if(S.pose!=='seated')return; S.pose='moving'; standBtn.style.display='none';
  tweenTo(standPos.clone(),standQuat(),1.5,()=>{S.pose='standing';hintEl.textContent='drag to look around · click the desk to sit down';});
}
standBtn.onclick=standUp;

// ---------- input ----------
function openSection(i){S.sel=i;if(SECTIONS[i].game)return startGame();if(SECTIONS[i].quiz)return startQuiz();if(SECTIONS[i].fact)return showFact(); S.sec=i;S.sel=i;S.mode='section';S.msg=null;glitch(clock.getElapsedTime());}
function showMsg(cmd,lines){S.mode='msg';S.msg={cmd,lines};glitch(clock.getElapsedTime());}
function toMenu(){S.mode='menu';glitch(clock.getElapsedTime());}
function runCmd(raw){
  const c=raw.trim().toLowerCase(); if(!c)return;
  const arg=c.replace(/^(cat|open|cd|less|more)\s+/,'').replace(/\.txt$/,'').replace(/^\.\//,'');
  if(S.mode==='game'&&S.game&&S.game.words.includes(c.toUpperCase()))return guess(c);
  if(['hack','game','play'].includes(c))return startGame();
  if(c==='funfact'||c==='fortune'||c==='fact')return showFact();
  if(c==='quiz'||c==='trivia')return startQuiz();
  if(c==='help')return showMsg('help',['ls / menu ....... list sections','cat <section> ... open a section, e.g. cat skills','1-9 ............. open by number','hack ............ play crack_the_vault','quiz ............ 5 random trivia questions','funfact ......... random fun fact','whoami .......... who are you?','clear ........... back to the menu','exit ............ stand up from the desk']);
  if(['ls','menu','clear','cd ..','ls ./about_me'].includes(c))return toMenu();
  if(c==='whoami')return showMsg('whoami',['visitor','','you are sitting at Vhutali\'s desk. be nice to the keyboard.']);
  if(c==='exit'||c==='logout')return standUp();
  if(c.startsWith('sudo'))return showMsg(c,['[sudo] password for visitor: ********','visitor is not in the sudoers file.','This incident will be reported.']);
  if(/^[1-9]$/.test(c))return openSection(+c-1);
  const idx=SECTIONS.findIndex(s=>s.id===arg||s.id.startsWith(arg)||s.id.split('_').includes(arg));
  if(idx>=0)return openSection(idx);
  showMsg(c,['command not found: '+c,'','type "help" to see what works.']);
}
function startScan(){if(S.mode==='scan'&&S.scanT<0&&S.grantT<0){S.scanT=clock.getElapsedTime();padGlowMat.color.set(0x3cff8f);}}

addEventListener('keydown',e=>{
  if(S.pose!=='seated'){if(e.key==='Enter'&&S.pose==='standing'){sit();}return;}
  if(e.key==='Escape'){standUp();return;}
  if(S.mode==='scan'){if(e.key==='Enter')startScan();return;}
  if(S.mode==='boot'||S.mode==='idle')return;
  if(S.mode==='quiz'&&!S.input){const k='abc123'.indexOf(e.key.toLowerCase()); if(k>=0&&e.key.length===1){pickAnswer(k%3);return;} if(e.key==='Enter'){e.preventDefault();nextQ();return;}}
  if(e.key==='Enter'){e.preventDefault(); if(S.input){const c=S.input;S.input='';runCmd(c);} else if(S.mode==='menu')openSection(S.sel); else if(S.mode==='msg'&&S.msg.fact)showFact(); else if(S.mode==='game'){if(S.game.done)startGame(); else guess(S.game.words[S.game.sel]);} else toMenu(); return;}
  if(e.key==='Backspace'){e.preventDefault(); if(S.input)S.input=S.input.slice(0,-1); else if(S.mode!=='menu')toMenu(); return;}
  if(S.mode==='menu'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();S.sel=(S.sel+(e.key==='ArrowDown'?1:-1)+SECTIONS.length)%SECTIONS.length;return;}
  if(S.mode==='game'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();S.game.sel=(S.game.sel+(e.key==='ArrowDown'?1:-1)+8)%8;return;}
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&S.input.length<40){S.input+=e.key;}
});

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let down=null, mouse={x:0,y:0};
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera); const hits=ray.intersectObjects(scene.children,true); for(const h of hits){if(h.object===room||h.object===floor)return null; if(h.object.userData.action)return h;} return null;}
function actionable(h){if(!h)return false;const a=h.object.userData.action;if(S.pose==='standing')return ['desk','main','chair','can','lamp','pad','note'].includes(a);if(S.pose==='seated')return ['main','can','lamp','pad','note'].includes(a);return false;}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
  mouse.x=e.clientX/innerWidth*2-1; mouse.y=e.clientY/innerHeight*2-1;
  if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y; if(Math.hypot(dx,dy)>5)down.moved=true;
    if(down.moved&&S.pose==='standing'){yaw-=e.movementX*0.0035; pitch-=e.movementY*0.0035; yaw=THREE.MathUtils.clamp(yaw,yaw0-1.3,yaw0+1.3); pitch=THREE.MathUtils.clamp(pitch,-0.7,0.5);}
    return;}
  renderer.domElement.style.cursor=actionable(pick(e))?'pointer':'grab';
});
renderer.domElement.addEventListener('pointerup',e=>{
  const wasDrag=down&&down.moved; down=null; if(wasDrag)return;
  const h=pick(e); if(!actionable(h))return; const a=h.object.userData.action;
  if(a==='can'){const g=h.object.userData.can;g.userData.down=!g.userData.down;return;}
  if(a==='note'){drawNote(FACTS[factIdx++%FACTS.length]);noteFlip=1;return;}
  if(a==='lamp'){lampLight.visible=!lampLight.visible;bulb.material.color.set(lampLight.visible?0xffc070:0x221a10);return;}
  if(a==='pad'){if(S.pose==='seated')startScan();else sit();return;}
  if(a==='chair'&&S.pose==='standing'){chair.userData.spin+=Math.PI*2;return;}
  if(S.pose==='standing'){sit();return;}
  if(a==='main'&&S.pose==='seated'){
    if(S.mode==='scan'){startScan();return;}
    if(S.mode==='menu'&&h.uv){const cy=(1-h.uv.y)*main.H; const i=Math.floor((cy-menuGeom.y0+5)/menuGeom.lh); if(i>=0&&i<SECTIONS.length)openSection(i);}
    else if(S.mode==='quiz'&&h.uv){const z=S.quiz; if(z.i>=z.qs.length){startQuiz();return;} if(z.picked!==null){nextQ();return;} const cy=(1-h.uv.y)*main.H; const k=Math.floor((cy-quizGeom.y0+5)/quizGeom.lh); if(k>=0&&k<3)pickAnswer(k);}
    else if(S.mode==='msg'&&S.msg.fact)showFact();
    else if(S.mode==='game'&&h.uv){if(S.game.done){startGame();return;} const cy=(1-h.uv.y)*main.H; const i=Math.floor((cy-gameGeom.y0+5)/gameGeom.lh); if(h.uv.x<0.57&&i>=0&&i<8){S.game.sel=i;guess(S.game.words[i]);}}
    else if(S.mode==='section'||S.mode==='msg')toMenu();
  }
});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

// ---------- loop ----------
const clock=new THREE.Clock();
let chairRot=0, first=true;
function loop(){
  const t=clock.getElapsedTime();
  if(tween){const k=Math.min(1,(t-tween.start)/tween.dur),e=ease(k); camera.position.lerpVectors(tween.fp,tween.p,e); camera.position.y-=Math.sin(k*Math.PI)*0.12; camera.quaternion.slerpQuaternions(tween.fq,tween.q,e); if(k>=1){const d=tween.done;tween=null;d&&d();}}
  else if(S.pose==='standing'){euler.set(pitch+Math.sin(t*0.5)*0.004,yaw+Math.sin(t*0.3)*0.006,0);camera.quaternion.setFromEuler(euler);}
  else if(S.pose==='seated'){const {q}=seatPose(); const off=new THREE.Quaternion().setFromEuler(new THREE.Euler(-mouse.y*0.06,-mouse.x*0.09,0,'YXZ')); camera.quaternion.copy(q).multiply(off);}
  // props
  chairRot+= (chair.userData.spin-chairRot)*0.05; chair.rotation.y=chairRot;
  cans.forEach(g=>{g.userData.k+=((g.userData.down?1:0)-g.userData.k)*0.15; g.rotation.z=g.userData.dir*g.userData.k*Math.PI/2; g.position.y=DY+0.025+g.userData.k*0.03;});
  if(S.mode==='scan'&&S.scanT<0){padGlowMat.color.setRGB(0.12,0.4+0.5*(0.5+0.5*Math.sin(t*5)),0.25);} else if(S.grantT<0&&S.scanT<0){padGlowMat.color.set(0x1f8f50);}
  noteFlip*=0.88; note.rotation.x=-noteFlip*1.2;
  rackLeds.forEach(m=>{if(Math.random()<0.04)m.visible=!m.visible;});
  screenLight.intensity=2.0+Math.sin(t*13)*0.08+(t<S.glitchUntil?Math.random()*1.5:0);
  drawMain(t); drawLeft(t); drawRight(t); drawTopL(t); drawTopR(t); drawRain();
  composer.render();
  if(first){first=false;document.getElementById('loading').remove();}
  requestAnimationFrame(loop);
}
loop();
</script>
<script>
  // if the 3D module fails to load (offline, old browser), say so instead of a blank page
  setTimeout(()=>{const l=document.getElementById('loading'); if(l) l.textContent='3D failed to load. Check your internet connection (three.js comes from a CDN) or try Chrome/Edge.';},8000);
</script>
