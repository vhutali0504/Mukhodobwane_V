[build]
  command = "npm run build"
  publish = "dist"

# A missing hashed file must 404, not fall through to index.html (a stale tab would then
# fail on the wrong MIME type). Real files are served first because rules are not forced.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP has no 'unsafe-inline' for scripts (the build emits none).
# style-src is 'self' only: React and three.js set styles through the CSSOM, which CSP does not block.
# No 'wasm-unsafe-eval': the room loads no WASM decoders.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://gc.zgo.at; connect-src 'self' https://*.goatcounter.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; img-src 'self' data: blob: https://*.goatcounter.com; style-src 'self'; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
